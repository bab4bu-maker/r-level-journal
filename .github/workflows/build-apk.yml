name: Build R-Level Journal APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'R-Level-Journal-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q R-Level-Journal-Android-Project.zip -d buildsrc
          ls -la buildsrc/RLevelJournalAndroid

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: buildsrc/RLevelJournalAndroid
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          cp buildsrc/RLevelJournalAndroid/app/build/outputs/apk/debug/app-debug.apk R-Level-Journal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R-Level-Journal-APK
          path: R-Level-Journal.apk
          if-no-files-found: error
